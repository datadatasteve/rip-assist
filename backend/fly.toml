app = 'rip-assist-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'production'
  FRONTEND_URL = 'https://datadatasteve.github.io/rip-assist/'
  OLLAMA_DEFAULT_MODEL = 'qwen2.5:14b'
  OLLAMA_ENDPOINT = 'http://100.87.209.56:11434'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
